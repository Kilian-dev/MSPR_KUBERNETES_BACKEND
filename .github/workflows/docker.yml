name: Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - generate-password
          - generate-2fa
          - authenticate
          - renew-credentials

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.function }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.function }}
          push: true
          tags: |
            valentinlob/${{ matrix.function }}:latest
            valentinlob/${{ matrix.function }}:${{ github.sha }}
